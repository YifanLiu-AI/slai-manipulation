<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>采集相机预览</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="device-mode">
      <span class="capture-mode">COMBINED</span>
      <span class="device-state" data-device="ur5">UR5 --</span>
      <span class="device-state" data-device="wuji">Wuji --</span>
    </div>
    <div class="record-badge" data-state="starting">
      <span class="record-dot"></span>
      <span class="record-label">准备中</span>
      <span class="record-detail"></span>
    </div>
    <main>
      <div class="camera-grid" id="camera-grid"></div>
      <section class="mouse">
        <div class="mouse-head">
          <span class="status"></span><strong>SpaceMouse</strong><span class="age">--</span>
        </div>
        <div class="device" aria-label="SpaceMouse Pro 实时输入示意图">
          <span class="device-shell"></span><span class="puck-base"></span><span class="puck"></span>
          <button class="key" data-button="one" style="--x:13%;--y:16%;--w:16%;--h:11%;--r:-18deg">1</button>
          <button class="key" data-button="two" style="--x:27%;--y:8%;--w:15%;--h:10%;--r:-12deg">2</button>
          <button class="key" data-button="three" style="--x:59%;--y:8%;--w:15%;--h:10%;--r:12deg">3</button>
          <button class="key" data-button="home" style="--x:73%;--y:16%;--w:16%;--h:11%;--r:18deg">4</button>
          <button class="key" data-button="esc" style="--x:11%;--y:29%;--w:17%;--h:8%">ESC</button>
          <button class="key" data-button="shift" style="--x:10%;--y:38%;--w:11%;--h:10%;--r:-8deg">SHIFT</button>
          <button class="key" data-button="ctrl" style="--x:20%;--y:38%;--w:13%;--h:9%">CTRL</button>
          <button class="key" data-button="alt" style="--x:14%;--y:47%;--w:17%;--h:8%;--r:-8deg">ALT</button>
          <button class="key" data-button="menu" style="--x:15%;--y:56%;--w:12%;--h:7%;--r:-12deg">MENU</button>
          <button class="key" data-button="roll_cw" style="--x:70%;--y:30%;--w:10%;--h:9%;--r:-7deg">ROLL</button>
          <button class="key" data-button="t" style="--x:80%;--y:31%;--w:9%;--h:10%;--r:5deg">T</button>
          <button class="key" data-button="rotation_lock" style="--x:74%;--y:39%;--w:12%;--h:10%">LOCK</button>
          <button class="key" data-button="front" style="--x:69%;--y:47%;--w:11%;--h:9%;--r:7deg">F</button>
          <button class="key" data-button="rear" style="--x:80%;--y:47%;--w:10%;--h:9%;--r:8deg">R</button>
          <button class="key" data-button="fit" style="--x:73%;--y:56%;--w:12%;--h:7%;--r:12deg">FIT</button>
        </div>
        <span class="motion-values">T 0.00 0.00 0.00 · R 0.00 0.00 0.00</span>
      </section>
      <section class="event-panel">
        <div class="event-title">采集日志</div>
        <div class="event-list"><div class="event empty">等待采集进程事件</div></div>
        <div class="temperature-status" data-temperature-level="unknown">
          <span class="temperature-label">Wuji 温度</span>
          <span class="temperature-value">--</span>
          <span class="temperature-detail">监测尚未就绪</span>
        </div>
      </section>
    </main>
    <template id="camera-template">
      <figure>
        <figcaption><span class="camera-label"></span><span class="camera-age">--</span></figcaption>
        <img alt="实时 RGB" />
      </figure>
    </template>
    <script src="/app.js" defer></script>
  </body>
</html>
