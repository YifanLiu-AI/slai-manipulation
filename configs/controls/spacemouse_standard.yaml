schema_version: 1
profile: spacemouse_standard
units:
  translation_speed: m/s
  rotation_speed: rad/s
motion:
  control_hz: 125
  acceleration: 0.50
  wrist_3_jog_speed: 0.20
  # Keep routine HOME below the UR5 worker's 0.60 rad/s fail-closed ceiling.
  home_joint_speed: 0.50
  # Zero disables the obsolete startup-relative workspace envelopes.
  max_offset_mm: 0.0
  max_rotation_deg: 0.0
  translation_speed: 0.107
  # Retain 10% headroom below the worker's 0.60 rad/s hard ceiling.
  rotation_speed: 0.54
  # Boost also retains 10% command headroom below hardware hard limits.
  precision_translation_speed: 0.225
  precision_rotation_speed: 0.54
  deadzone: 0.12
hand:
  command_hz: 30
  grasp_speed: 0.50
  grasp_acceleration: 1.50
  release_speed: 6.0
  release_acceleration: 40.0
  retarget_speed: 3.0
  retarget_acceleration: 16.0
  lost_hand_return_delay: 0.50
  one_euro_min_cutoff: 3.0
  one_euro_beta: 1.0
bindings:
  menu: start_episode
  fit: save_episode
  esc: discard_episode_and_home
  button_1: wrist_3_jog_clockwise
  button_2: wrist_3_jog_counterclockwise
  button_3: gripper_close_continuous_while_held
  button_4: gripper_open_continuous_while_held
  t: robot_home
  r: wrist_home_only
  ctrl_c: finalize_dataset
