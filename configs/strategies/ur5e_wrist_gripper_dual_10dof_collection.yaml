  status: ready
  supported_apps: [collect_real]
  required_hardware: [ur5, wrist_sensor, gripper, spacemouse, cameras]
  disabled_hardware: [wujihand]
  inputs: [spacemouse, wrist_master_esp32, collection_cameras]
  outputs: [ur5e, wrist_slave_openrb, hiwonder_gripper]
  control:
    ur5e: spacemouse_twist
    wrist: wrist_master_to_slave_auto_zero
    gripper: spacemouse_button_3_close_button_4_open
  physical_dof: 9
dataset:
  recorded_dof: 10
  state_schema: task2_gripper_dual_10dof
  input_schema: configs/input_schemas/ur5e_wrist_gripper_dual_10dof_binary.yaml
  note: Records both binary gripper state/action and raw servo position/target. Select the binary or raw schema explicitly for training.
