[project]
name = "slai-manipulation-intelligence"
version = "0.1.0"
description = "Wujihand and UR5 data collection, training, and inference pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "scipy>=1.15",
]

[project.optional-dependencies]
pi05-train = [
    "swanlab>=0.9,<1",
    "wandb>=0.19",
]
pose-hub = [
    "fastapi>=0.115",
    "pin>=4.1,<5",
    "uvicorn[standard]>=0.32",
    "websockets>=15",
]
modelscope = [
    "modelscope-hub==0.2.0",
]

[project.scripts]
slai-teleop-real = "slai_mi.apps.teleop_real:main"
slai-teleop-sim = "slai_mi.apps.teleop_sim:main"
slai-collect-real = "slai_mi.apps.collect_real:main"
slai-collect-sim = "slai_mi.apps.collect_sim:main"
slai-collection-ui = "slai_mi.ui.collection_frontend:main"
slai-train = "slai_mi.train:main"
slai-infer = "slai_mi.inference:main"
# Canonical name; keep slai-infer above as a backwards-compatible alias.
slai-mi-infer = "slai_mi.inference:main"
slai-evaluate = "slai_mi.apps.evaluate:main"
slai-pi05 = "slai_mi.apps.pi05:main"
slai-deploy-real = "slai_mi.apps.deploy_real:main"
slai-pose-hub = "slai_mi.apps.pose_hub:main"
slai-pose-hub-bridge = "slai_mi.apps.pose_hub_bridge:main"
slai-record-pose = "slai_mi.apps.record_pose:main"
slai-wuji-retarget-check = "slai_mi.apps.check_wuji_retarget:main"
slai-park-wrist = "slai_mi.apps.park_wrist:main"
slai-task2-home = "slai_mi.apps.task2_home:main"
slai-gripper = "slai_mi.apps.gripper:main"
slai-task2-state = "slai_mi.apps.task2_state:main"
slai-spacemouse-echo = "slai_mi.apps.spacemouse_echo:main"
slai-modelscope = "slai_mi.apps.modelscope_transfer:main"
slai-strategies = "slai_mi.apps.strategies:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slai_mi"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["clients", "docs/legacy", "third_party"]

[tool.pytest.ini_options]
testpaths = ["tests"]
